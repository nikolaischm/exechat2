name: iPhone-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project CHAT.xcodeproj -target CHAT -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "error:|fatal error|\*\* BUILD FAILED" build.log | sort -u | head -40 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -60 build.log > errors.txt; fi
          while IFS= read -r line; do echo "::error::${line//%/%25}"; done < <(head -9 errors.txt)
          # Protokoll zusätzlich in den Zweig "build-log" legen
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rq --cached . || true
          cp build.log full-build.log
          git add -f errors.txt full-build.log
          git commit -qm "Build-Fehler ${GITHUB_RUN_ID}"
          git push -f origin build-log

      - name: .ipa packen
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CHAT.app Payload/
          zip -qr CHAT.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CHAT-ipa
          path: CHAT.ipa
