name: iPhone-App bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen (unsigniert)
        run: |
          xcodebuild -project CHAT.xcodeproj -target CHAT -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: .ipa packen
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CHAT.app Payload/
          zip -qr CHAT.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CHAT-ipa
          path: CHAT.ipa
